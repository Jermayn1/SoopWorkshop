events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    server_tokens off;

    # Das Log geht auf die Container-Ausgabe, damit "docker compose logs
    # frontend" den ganzen Verkehr zeigt und nicht nur die Haelfte.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------- http ----
    # Nur zum Umleiten. Wer die Adresse ohne Schema eintippt, landet hier - und
    # soll nicht auf einer unverschluesselten Seite bleiben.
    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------------- https ----
    server {
        listen 443 ssl;
        http2 on;

        # Absichtlich "_": der Name steht nicht im Image, sondern im Zertifikat
        # und im DNS. Damit laeuft dasselbe Image unter jedem Namen.
        server_name _;

        ssl_certificate     /etc/nginx/certs/soop.pem;
        ssl_certificate_key /etc/nginx/certs/soop-key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        # KEIN Strict-Transport-Security. Das ist eine bewusste Entscheidung und
        # kein Vergessen: HSTS macht die Zertifikatswarnung UNUMGEHBAR. Auf einem
        # Rechner ohne das Wurzelzertifikat der eigenen CA waere die Seite dann
        # gar nicht mehr erreichbar - aus einer Unbequemlichkeit wuerde eine
        # Sperre. Fuer einen internen Dienst mit selbstverwalteter CA ist das der
        # falsche Tausch. Mit einem oeffentlich vertrauenswuerdigen Zertifikat
        # koennte der Kopf gesetzt werden.

        root /usr/share/nginx/html;
        index index.html;

        # Dockers eingebauter DNS. Zusammen mit der Variablen unten loest nginx
        # den Namen "backend" bei jeder Anfrage auf statt einmal beim Start.
        #
        # Der Unterschied ist betrieblich wichtig: mit einem festen Namen im
        # proxy_pass bricht nginx den START ab, wenn der Name gerade nicht
        # aufloest ("host not found in upstream"). Ein Backend, das sich neu
        # aufbaut, haette damit die ganze Seite mitgenommen - Teilnehmer saehen
        # "Verbindung abgelehnt" statt einer Seite mit Fehlermeldung. So bleibt
        # die Seite stehen und der Aufruf endet sauber mit 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;

        # -------------------------------------------------------- API ---------
        # Derselbe Ursprung wie die Seite. Damit entfaellt CORS im Betrieb
        # vollstaendig, und das Anmelde-Cookie ueberquert keine Origin-Grenze.
        location /api/ {
            # $request_uri anhaengen ist bei einer Variablen Pflicht: ohne den
            # ausdruecklichen Pfad wuerde nginx ihn verwerfen und jeden Aufruf
            # auf / des Backends schicken.
            proxy_pass $backend_upstream$request_uri;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Der wichtigste der vier: ohne ihn sieht das Backend hinter dem
            # Proxy immer "http" und stellt das Anmelde-Cookie ohne Secure aus,
            # obwohl der Browser ueber https spricht (UseForwardedHeaders in
            # Program.cs wertet genau diesen Kopf aus).
            proxy_set_header X-Forwarded-Proto $scheme;

            # 10 MB, dieselbe Grenze wie SubmissionUploadLimits.MaxTotalSizeBytes.
            #
            # Die Voreinstellung von nginx ist 1 MB. Damit haette der Proxy jede
            # Abgabe ueber 1 MB mit einer ENGLISCHEN HTML-Fehlerseite abgelehnt -
            # auch die, zu denen der Server einen fertigen deutschen Satz hat
            # ("'Gross.java' ist groesser als 1024 KB."). Nachgemessen: mit
            # dieser Zeile kommt der Satz durch.
            #
            # Was sie NICHT leistet: oberhalb der Gesamtgrenze antwortet nginx
            # mit 413 und englischem HTML. Dort gaebe es aber ohnehin keinen
            # deutschen Satz - ASP.NETs RequestSizeLimit bricht das Binden schon
            # vor der Validierung ab. Das Frontend blockt den Fall clientseitig,
            # ein Teilnehmer erreicht ihn also gar nicht.
            client_max_body_size 10m;

            # Eine Auswertung darf laenger dauern als die Voreinstellung von 60s
            # (JUnitRunTimeoutSeconds plus Kompilieren plus Wartezeit in der
            # Schlange). Bricht der Proxy vorher ab, sieht der Teilnehmer einen
            # Fehler, waehrend die Auswertung im Hintergrund noch laeuft.
            proxy_read_timeout 300s;
        }

        # Der Healthcheck des Backends, damit er auch von aussen erreichbar ist.
        location = /health {
            proxy_pass $backend_upstream/health;
            access_log off;
        }

        # ------------------------------------------------------- Seite --------
        location /assets/ {
            # Die Dateinamen tragen einen Hash aus dem Build - eine geaenderte
            # Datei heisst anders. Damit ist ewiges Cachen sicher.
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            # react-router lebt im Browser: /aufgaben/<guid> ist keine Datei auf
            # der Platte. Ohne diese Zeile liefert ein direkt aufgerufener oder
            # neu geladener Unterpfad einen 404 - dieselbe Klasse Fehler wie
            # UseStatusCodePagesWithReExecute im alten Blazor-Frontend.
            try_files $uri $uri/ /index.html;

            # index.html selbst darf NIE gecacht werden: sie verweist auf die
            # gehashten Dateinamen. Eine alte index.html zeigt nach einer neuen
            # Fassung auf Dateien, die es nicht mehr gibt - die Seite bleibt weiss.
            add_header Cache-Control "no-cache";
        }
    }
}
