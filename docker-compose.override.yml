# Nur fuer die ENTWICKLUNG. Compose laedt diese Datei automatisch dazu, wenn
# sie neben docker-compose.yml liegt - auf dem Server gehoert sie nicht hin.
#
# Zweck: die Datenbank von aussen erreichbar machen. Lokal laufen Backend und
# Frontend nicht im Container, sondern ueber scripts/start-dev.ps1 - sie
# brauchen deshalb einen veroeffentlichten Port.
#
#   docker compose up -d db      startet nur die Datenbank (der uebliche Fall)
#
# Auf dem Server:
#   docker compose -f docker-compose.yml up -d --build

services:
  db:
    ports:
      # Nur an den IPv4-Loopback binden. Ohne die Adresse bindet Docker an alle
      # Schnittstellen und legt zusaetzlich einen IPv6-Listener an. "localhost"
      # loest unter Windows zuerst auf ::1 auf, wo der WSL-Relay horcht und die
      # Verbindung nicht zum Container durchreicht - das aeussert sich als
      # "28P01 password authentication failed" und kostet viel Suchzeit.
      - "127.0.0.1:5432:5432"
    networks:
      # In der Entwicklung zusaetzlich im aeusseren Netz, sonst kann der
      # veroeffentlichte Port nicht durchgereicht werden: ein Netz mit
      # internal: true laesst keine Portfreigabe zu.
      - intern
      - aussen
