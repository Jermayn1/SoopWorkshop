# Entwicklungsumgebung. Aktuell nur die Datenbank -
# Backend und Frontend kommen in Phase 7 dazu.
#
#   docker compose up -d      startet die Datenbank
#   docker compose down       stoppt sie (Daten bleiben im Volume)
#   docker compose down -v    stoppt sie und loescht die Daten
#
# Die Zugangsdaten stehen in .env (gitignoriert), Vorlage ist .env.example.

services:
  db:
    image: postgres:16-alpine
    container_name: soopworkshop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soopworkshop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - .env aus .env.example anlegen}
    ports:
      # Nur an IPv4-Loopback binden. Ohne die Adresse bindet Docker an alle
      # Schnittstellen und legt zusaetzlich einen IPv6-Listener an. "localhost"
      # loest unter Windows zuerst auf ::1 auf, wo der WSL-Relay horcht und die
      # Verbindung nicht zum Container durchreicht - das aeussert sich als
      # "28P01 password authentication failed" und kostet viel Suchzeit.
      # Nebeneffekt: die Datenbank ist nicht mehr aus dem lokalen Netz erreichbar.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-soopworkshop}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
